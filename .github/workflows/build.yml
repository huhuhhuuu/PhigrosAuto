name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 默认 token 是只读的，失败时要把编译日志提交回仓库供排查，必须显式放开
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 第一步：在便宜的 Linux 机器上做静态检查，抓语法/明显错误，
  # 省掉 macOS 分钟数。这一步红了就不用看后面。
  # ------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight (preflight.py)
        run: python3 tools/preflight.py

  # ------------------------------------------------------------
  # 第二步：macOS 上真正编译，出 rootless deb
  # ------------------------------------------------------------
  deb:
    needs: lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-macos-v2

      - name: Install toolchain
        run: |
          set -euo pipefail
          # fakeroot 在 macOS 上 Theos 打包 .deb 时需要；homebrew 无此 formula 时退回 dpkg-deb 直构
          brew install ldid xz || true
          brew install dpkg || brew install dpkg-sig || true
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          # iOS SDK：Theos 不自带，单独拉
          if [ -z "$(ls -A "$HOME/theos/sdks" 2>/dev/null || true)" ]; then
            mkdir -p "$HOME/theos/sdks"
            curl -L --retry 3 -o /tmp/sdks.zip https://github.com/theos/sdks/archive/master.zip
            unzip -q /tmp/sdks.zip -d /tmp/sdks
            mv /tmp/sdks/sdks-master/*.sdk "$HOME/theos/sdks/"
          fi
          echo "--- sdks ---"; ls "$HOME/theos/sdks"
          echo "--- tools ---"
          command -v dpkg-deb || echo "NO dpkg-deb"
          command -v fakeroot || echo "NO fakeroot (Theos 会退回 dpkg-deb 直构)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Ensure dpkg-deb available
        run: |
          set -e
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
          dpkg-deb --version | head -1
          # Theos 打包需要 fakeroot 或等效手段；缺了就装
          if ! command -v fakeroot >/dev/null 2>&1; then
            brew install fakeroot 2>/dev/null || echo "fakeroot 不可用，Theos 将用 dpkg-deb 直接打包"
          fi

      - name: Build rootless
        id: build
        run: |
          set -o pipefail
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0 2>&1 | tee build.log
        continue-on-error: true

      - name: Publish build log to repo (so it can be read without admin)
        if: always()
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "# build log $(date -u +%FT%TZ)"
            echo '```'
            tail -200 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > ci-logs/last-build.md
          git config user.name  "ci-bot"
          git config user.email "ci-bot@local"
          git add -f ci-logs/last-build.md
          git commit -q -m "ci: build log $(date -u +%s)" || true
          git push origin HEAD:main || echo "push failed (probably protected branch)"

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Verify package
        run: |
          set -e
          ls -lh packages/
          DEB=$(ls packages/*.deb | head -1)
          dpkg-deb -I "$DEB"
          # rootless 三连校验：架构、路径前缀、两个插件文件
          dpkg-deb -I "$DEB" | grep -q 'iphoneos-arm64' || { echo "架构不对：不是 rootless"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q '/var/jb/' || { echo "包内路径缺 /var/jb 前缀：不是 rootless"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q 'DynamicLibraries/PhigrosAuto.dylib' || { echo "缺 dylib"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q 'DynamicLibraries/PhigrosAuto.plist' || { echo "缺 plist"; exit 1; }
          echo "包结构校验通过"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: PhigrosAuto-rootless
          path: packages/*.deb
          if-no-files-found: error
